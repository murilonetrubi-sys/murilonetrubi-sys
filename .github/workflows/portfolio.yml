name: Public portfolio checks

on:
  push:
    branches: [main]
    paths:
      [
        "lab/**",
        "portfolio/**",
        "assets/**",
        "README.md",
        ".github/workflows/portfolio.yml",
      ]
  pull_request:
    paths:
      [
        "lab/**",
        "portfolio/**",
        "assets/**",
        "README.md",
        ".github/workflows/portfolio.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: Install pinned development tools
        working-directory: lab
        run: npm ci --ignore-scripts
      - name: Core and server tests
        working-directory: lab
        run: npm test
      - name: Public content audit
        working-directory: lab
        run: npm run audit:public
      - name: Install browser
        working-directory: lab
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        working-directory: lab
        run: npm run test:ui
